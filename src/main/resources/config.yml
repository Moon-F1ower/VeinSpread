growth-chance: 0.02

vein:
  catalyst-block: "SCULK_CATALYST"
  result-block: "SCULK"
  
  replaceable-blocks:
    - "STONE"
    - "COBBLESTONE"
    - "DIRT"
    - "GRASS_BLOCK"
    - "DEEPSLATE"

  tip-energy: 25
  branch-chance: 0.35
  max-branch-depth: 10
  persistence: 0.5
  vertical-branch-chance: 0.15
  max-tips-per-catalyst: 500

  # THICKENING SETTINGS (Filling gaps near the center)
  thicken-per-tick: 5
  max-thickness-radius: 12.0
  
  # Maximum number of blocks one catalyst can infect.
  # Set to -1 to remove the limit.
  max-blocks-per-catalyst: 5000

  # Should the plugin call BlockSpreadEvent for thickening?
  # Set to true for WorldGuard compatibility, but it may cause lag.
  call-event-on-thicken: false

time-conditions:
  enabled: false
  start-time: 13000
  end-time: 23000

console-language: "en"